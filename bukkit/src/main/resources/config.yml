tps-performance-observation-value: -1

fake-players:
  enabled: true

  count-fake-players-to-online-players: false

remove-gray-color-from-tab-in-spectator: false

ignore-vanished-players-in-online-players: true

count-vanished-staffs: true

hide-player-from-tab-when-afk: true

per-world-player-list:
  enabled: true

  world-groups:
    : World
    - world
    - netherworld

    exampleGroup2:
    - exampleWorld2
    - exampleAnotherWorld2

placeholder-format:
  afk-status: true
    enable: true

    show-in-right-or-left-side: true

    show-player-group: true

    format-yes: "&7 AFK&r "
    format-no: "lol"

    sort-last: false

  time:
    time-zone: "BST"

    use-system-zone: true

    time-format: "HH:mm"

    date-format: "dd/MM/yyyy"

  ping:
    enable: true
    formats:
    - "&a%ping% <= 200"
    - "&6%ping% >= 200"
    - "&c%ping% > 500"

  tps:
    enable: true

    formats:
    - '&a%tps% > 18.0'
    - '&6%tps% == 16.0'
    - '&c%tps% < 16.0'

    size: 3

change-prefix-suffix-in-tablist:
  enable: true

  refresh-interval: 4

  disabled-worlds:
    use-as-whitelist: false
    list:
    - WORLDO

  sync-plugins-groups-with-tablist: true

  hide-group-when-player-vanished: false

  assign-global-group-to-normal: false

  prefer-primary-vault-group: false

  use-luckperms-weight-to-order-groups-to-first-place: false

  followNameTagVisibility: false

tablist-object-type:

  type: ping

  refresh-interval: 3
  custom-value: "%level%"

  disabled-worlds:
  - testingWorld

check-update: true

download-updates: false

logconsole: true
